# Prometheus scrape configuration for the A2A debate network.
# Each agent exposes /metrics on its existing port (no extra ports needed).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "a2a-orchestrator"
    static_configs:
      - targets: ["orchestrator:8080"]
        labels:
          agent_type: "orchestrator"

  - job_name: "a2a-normalizer"
    static_configs:
      - targets: ["normalizer:8081"]
        labels:
          agent_type: "normalizer"

  - job_name: "a2a-feedback"
    static_configs:
      - targets: ["feedback:8084"]
        labels:
          agent_type: "feedback"

  - job_name: "a2a-debate-agents"
    static_configs:
      - targets: ["ae1:8082"]
        labels: {agent_type: "ae", ae: "ae1"}
      - targets: ["ae2:8083"]
        labels: {agent_type: "ae", ae: "ae2"}
      - targets: ["ae3:8087"]
        labels: {agent_type: "ae", ae: "ae3"}

  - job_name: "a2a-mcp-tools"
    static_configs:
      # MCP server exposes metrics on a sidecar port (FastMCP owns :8085).
      - targets: ["mcp-tools:8185"]
        labels:
          agent_type: "mcp_tools"
