# Prometheus scrape config for LOCAL development (start.bat).
# Targets point to host.docker.internal so Prometheus in Docker
# can reach agents running natively on the host machine.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "a2a-orchestrator"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          agent_type: "orchestrator"

  - job_name: "a2a-normalizer"
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          agent_type: "normalizer"

  - job_name: "a2a-feedback"
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          agent_type: "feedback"

  - job_name: "a2a-role-workers"
    static_configs:
      - targets:
          - "host.docker.internal:8082"
          - "host.docker.internal:8083"
          - "host.docker.internal:8087"
          - "host.docker.internal:8088"
          - "host.docker.internal:8089"
          - "host.docker.internal:8090"
        labels:
          agent_type: "role_worker"

  - job_name: "a2a-mcp-tools"
    static_configs:
      - targets: ["host.docker.internal:8185"]
        labels:
          agent_type: "mcp_tools"
